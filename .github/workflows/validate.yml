name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # hassfest moving @master validates against the latest HA core release
      - uses: home-assistant/actions/hassfest@master  # zizmor: ignore[unpinned-uses]

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # HACS's own action documents @main as the supported usage
      - uses: hacs/action@main  # zizmor: ignore[unpinned-uses]
        with:
          category: integration
